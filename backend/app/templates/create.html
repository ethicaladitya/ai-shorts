{% extends "base.html" %}
{% block title %}Create Video{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900">Create Video</h2>
    <p class="text-gray-500 text-sm mt-1">Start a new short-form video project</p>
</div>

<div class="bg-white rounded-xl border border-gray-200 p-8 max-w-2xl">
    {% if error %}
    <div class="mb-5 bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-700">
        {{ error }}
    </div>
    {% endif %}
    <form action="/videos/create" method="POST" class="space-y-6">
        <!-- Topic -->
        <div>
            <label for="topic" class="block text-sm font-medium text-gray-700 mb-1.5">Topic *</label>
            <input type="text" name="topic" id="topic" required
                placeholder="e.g., 5 AI tools that will replace your job in 2026"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent placeholder:text-gray-400">
            <p class="text-xs text-gray-400 mt-1">The main topic or angle for your video</p>
        </div>

        <!-- WordPress URL -->
        <div>
            <label for="wordpress_url" class="block text-sm font-medium text-gray-700 mb-1.5">WordPress URL (optional)</label>
            <input type="url" name="wordpress_url" id="wordpress_url"
                placeholder="https://yourblog.com/post-slug"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent placeholder:text-gray-400">
            <p class="text-xs text-gray-400 mt-1">Pull content from an existing blog post</p>
        </div>

        <!-- Custom Notes -->
        <div>
            <label for="custom_notes" class="block text-sm font-medium text-gray-700 mb-1.5">Custom Notes (optional)</label>
            <textarea name="custom_notes" id="custom_notes" rows="4"
                placeholder="Add any specific angle, data points, quotes, or context you want included..."
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent placeholder:text-gray-400 resize-none"></textarea>
        </div>

        <!-- Submit -->
        <div class="flex items-center gap-3 pt-2">
            <button type="submit"
                class="inline-flex items-center gap-2 px-5 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-800 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                Create & Generate Hooks
            </button>
            <a href="/" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
