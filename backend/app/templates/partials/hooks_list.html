<!-- Hooks list partial (HTMX fragment) -->
<div class="space-y-3">
    {% for hook in hooks %}
    <div class="bg-white rounded-xl border border-gray-200 p-5 hover:border-gray-300 transition">
        <div class="flex items-start justify-between">
            <div class="flex-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600 mb-2">
                    {{ hook.type | upper if hook.type else 'HOOK' }}
                </span>
                <p class="text-gray-900 font-medium">{{ hook.text if hook.text else hook }}</p>
                {% if hook.why_it_works %}
                <p class="text-xs text-gray-400 mt-2">💡 {{ hook.why_it_works }}</p>
                {% endif %}
            </div>
            <form action="/videos/{{ video.id }}/select-hook" method="POST" class="ml-4 flex-shrink-0">
                <input type="hidden" name="hook_text" value="{{ hook.text if hook.text else hook }}">
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition">
                    Select →
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
